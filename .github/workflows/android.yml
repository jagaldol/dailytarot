name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        # sdkmanager is no longer on PATH in the runner image; call the preinstalled command-line tools.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' > /dev/null
      - name: Build, test, and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lint :app:assembleRelease
      - name: Check card assets
        run: python3 tools/check_assets.py
